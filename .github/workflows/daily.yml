name: 每日签到（网易云 + 可选 WPS / Any Router）

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 的 cron 使用 UTC；06:00 UTC = 北京时间 14:00（下午 2 点）
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run daily sign-in
        env:
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
          WPS_TASK_COOKIE: ${{ secrets.WPS_TASK_COOKIE }}
          WPS_UID: ${{ secrets.WPS_UID }}
          WPS_COOKIE: ${{ secrets.WPS_COOKIE }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          UA_PC = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"
          UA_IPHONE = "Mozilla/5.0 (iPhone; CPU iPhone OS 13_5_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/13.1.1 Mobile/15E148 Safari/604.1"
          UA_MAC = "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_5) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/13.1.1 Safari/605.1.15"


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          OPENER = urllib.request.build_opener(NoRedirect)


          def http(url, method="GET", headers=None, body=None):
              req = urllib.request.Request(url, data=body, headers=headers or {}, method=method)
              try:
                  with OPENER.open(req, timeout=20) as resp:
                      return resp.status, resp.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, e.read().decode("utf-8", "replace")
                  except Exception:
                      return e.code, ""
              except Exception as e:
                  return -1, "%s: %s" % (type(e).__name__, e)


          def as_json(raw):
              try:
                  return json.loads(raw)
              except Exception:
                  return {"_raw": raw[:160]}


          def short(text, n=140):
              text = str(text).replace("\n", " ")
              return text if len(text) <= n else text[:n] + "…"


          def find_point(obj, depth=0):
              """网易云奖励数值可能叫 point / points / award，也可能藏在 data 里；找不到就返回 None。"""
              if depth > 3 or obj is None:
                  return None
              if isinstance(obj, dict):
                  for k in ("point", "points", "award", "score", "num"):
                      v = obj.get(k)
                      if isinstance(v, (int, float)) and not isinstance(v, bool):
                          return v
                      if isinstance(v, str) and v.strip().isdigit():
                          return int(v.strip())
                  for v in obj.values():
                      r = find_point(v, depth + 1)
                      if r is not None:
                          return r
              return None


          def netease_sign(cookie):
              """网易云每日签到：code=200 成功 / -2 今日已签 / 301 未登录。"""
              cookie = (cookie or "").strip()
              if not cookie:
                  return False, "没填 NETEASE_COOKIE，去仓库 Secrets 里加一个"
              notes = []
              for typ, ua, label in ((0, UA_IPHONE, "App"), (1, UA_MAC, "网页")):
                  try:
                      st, raw = http("https://music.163.com/api/point/dailyTask?type=%d" % typ,
                                     headers={"Cookie": cookie, "User-Agent": ua,
                                              "Referer": "https://music.163.com/"})
                      d = as_json(raw)
                      code = d.get("code")
                      print("  [网易云 %s] HTTP %s %s" % (label, st, short(raw, 160)))
                      if code in (200, -2) or "已签" in str(d.get("message") or ""):
                          if code == -2:
                              return True, "今天已经签过了（重复签到，不用再签）"
                          point = find_point(d)
                          if point is not None:
                              return True, "签到成功，云贝/经验 +%s。去 App「云贝中心」能核对" % point
                          return True, "签到成功，云贝已发放。去 App「云贝中心」核对余额"
                      if code == 301:
                          notes.append("%s：Cookie 失效了，重新抓一次 NETEASE_COOKIE（要含 MUSIC_U）" % label)
                      else:
                          notes.append("%s：接口返回 code=%s %s" % (label, code, d.get("message") or ""))
                  except Exception as e:
                      notes.append("%s：连不上（%s）" % (label, type(e).__name__))
              return False, "；".join(notes)


          def humanize_wps(msg):
              """把接口黑话翻译成人话。"""
              m = str(msg)
              if "userNotLogin" in m or "登录态失效" in m:
                  return "Cookie 不被任务中心认可，去「WPS 任务中心」那个页面重新抓一次（教程第 3 步）"
              if "named cookie" in m or "没有 wps_sid" in m or "缺 wps_sid" in m:
                  return "Cookie 不完整，必须包含 wps_sid=...（教程第 3 步）"
              if "缺少 uid" in m:
                  return "Cookie 里没带 uid=数字，再加一个 Secret `WPS_UID`（WPS 账号信息里的数字用户 ID）"
              if "HTTP" in m or "接口" in m or "异常" in m:
                  return "接口没返回成功：" + short(m, 90) + "（把这张卡片截图发我）"
              return short(m, 110)


          # ---------- 零依赖加密：只用 Python 标准库，不装任何第三方包 ----------
          # V5 会报「加密库没装上」，是因为 pip 只在新 Secret 存在时才执行；
          # V6 直接自己实现 AES-256-CBC + RSA PKCS#1 v1.5，已与 pycryptodome 逐字节对照通过。

          def _xt(a):
              a <<= 1
              return (a ^ 0x1B) & 0xFF if a & 0x100 else a & 0xFF


          def _mul(a, b):
              r = 0
              for _ in range(8):
                  if b & 1:
                      r ^= a
                  a = _xt(a)
                  b >>= 1
              return r


          def _pow(a, n):
              r = 1
              while n:
                  if n & 1:
                      r = _mul(r, a)
                  a = _mul(a, a)
                  n >>= 1
              return r


          def _rotl(x, n):
              return ((x << n) | (x >> (8 - n))) & 0xFF


          SBOX = []
          for _i in range(256):
              _inv = _pow(_i, 254) if _i else 0
              SBOX.append(_inv ^ _rotl(_inv, 1) ^ _rotl(_inv, 2) ^ _rotl(_inv, 3) ^ _rotl(_inv, 4) ^ 0x63)


          def _expand(key):
              w = [list(key[i * 4:(i + 1) * 4]) for i in range(8)]
              rcon = 1
              for i in range(8, 60):
                  t = w[i - 1][:]
                  if i % 8 == 0:
                      t = t[1:] + t[:1]
                      t = [SBOX[b] for b in t]
                      t[0] ^= rcon
                      rcon = _xt(rcon)
                  elif i % 8 == 4:
                      t = [SBOX[b] for b in t]
                  w.append([w[i - 8][j] ^ t[j] for j in range(4)])
              return w


          def _enc_block(block, w):
              s = [[block[c * 4 + r] for r in range(4)] for c in range(4)]

              def ark(rnd):
                  for c in range(4):
                      for r in range(4):
                          s[c][r] ^= w[rnd * 4 + c][r]

              ark(0)
              for rnd in range(1, 14):
                  for c in range(4):
                      for r in range(4):
                          s[c][r] = SBOX[s[c][r]]
                  for r in range(1, 4):
                      row = [s[c][r] for c in range(4)]
                      for c in range(4):
                          s[c][r] = row[(c + r) % 4]
                  for c in range(4):
                      a0, a1, a2, a3 = (s[c][r] for r in range(4))
                      s[c][0] = _mul(a0, 2) ^ _mul(a1, 3) ^ a2 ^ a3
                      s[c][1] = a0 ^ _mul(a1, 2) ^ _mul(a2, 3) ^ a3
                      s[c][2] = a0 ^ a1 ^ _mul(a2, 2) ^ _mul(a3, 3)
                      s[c][3] = _mul(a0, 3) ^ a1 ^ a2 ^ _mul(a3, 2)
                  ark(rnd)
              for c in range(4):
                  for r in range(4):
                      s[c][r] = SBOX[s[c][r]]
              for r in range(1, 4):
                  row = [s[c][r] for c in range(4)]
                  for c in range(4):
                      s[c][r] = row[(c + r) % 4]
              ark(14)
              return bytes(s[c][r] for c in range(4) for r in range(4))


          def aes_cbc_encrypt(plain, key, iv):
              n = 16 - len(plain) % 16
              data = plain + bytes([n]) * n
              w = _expand(key)
              out, prev = b"", iv
              for i in range(0, len(data), 16):
                  prev = _enc_block(bytes(x ^ y for x, y in zip(data[i:i + 16], prev)), w)
                  out += prev
              return out


          def _tlv(buf, pos):
              tag = buf[pos]
              pos += 1
              length = buf[pos]
              pos += 1
              if length & 0x80:
                  nb = length & 0x7F
                  length = int.from_bytes(buf[pos:pos + nb], "big")
                  pos += nb
              return tag, buf[pos:pos + length], pos + length


          def rsa_pkcs1_encrypt(msg, public_key_pem):
              body = "".join(ln.strip() for ln in public_key_pem.splitlines() if not ln.startswith("-----"))
              der = base64.b64decode(body)
              _, outer, _ = _tlv(der, 0)
              t0, first, p1 = _tlv(outer, 0)
              if t0 == 0x02:
                  # WPS 实际返回的是 PKCS#1 裸公钥：SEQUENCE { INTEGER n, INTEGER e }
                  nb = first
                  _, eb, _ = _tlv(outer, p1)
              else:
                  # 也兼容常见的 SPKI：SEQUENCE { AlgorithmIdentifier, BIT STRING }
                  _, bitstr, _ = _tlv(outer, p1)
                  _, inner, _ = _tlv(bitstr, 1)
                  _, nb, p2 = _tlv(inner, 0)
                  _, eb, _ = _tlv(inner, p2)
              n = int.from_bytes(nb.lstrip(b"\x00") or b"\x00", "big")
              e = int.from_bytes(eb.lstrip(b"\x00") or b"\x00", "big")
              k = (n.bit_length() + 7) // 8
              assert k >= len(msg) + 11, "公钥太短"
              ps = bytearray()
              while len(ps) < k - len(msg) - 3:
                  b = os.urandom(1)
                  if b != b"\x00":
                      ps += b
              em = b"\x00\x02" + bytes(ps) + b"\x00" + msg
              return pow(int.from_bytes(em, "big"), e, n).to_bytes(k, "big")


          def norm_wps_cookie(c):
              """只贴了一串 V02S... 时自动补成 wps_sid=..."""
              c = (c or "").strip()
              if c and "wps_sid=" not in c and c.startswith("V02S"):
                  return "wps_sid=" + c
              return c


          def task_center_sign(cookie, uid):
              """WPS 用户中心 →「任务 → 签到领奖励」——后台能看见的那一个。"""
              cookie = (cookie or "").strip()
              if not cookie:
                  return False, "没填 WPS_TASK_COOKIE"
              if "wps_sid=" not in cookie:
                  return False, "Cookie 里没有 wps_sid"
              m_uid = re.search(r"(?:^|[;,\s])uid=(\d+)", cookie)
              user_id = int(uid) if str(uid or "").strip().isdigit() else (int(m_uid.group(1)) if m_uid else 0)
              if not user_id:
                  return False, "缺少 uid"
              import random
              import string
              print("  [WPS·加密] 内置加密已就绪（不依赖任何第三方库）")
              base = {
                  "User-Agent": UA_PC,
                  "Accept": "application/json, text/plain, */*",
                  "Content-Type": "application/json",
                  "Origin": "https://personal-act.wps.cn",
                  "Referer": "https://personal-act.wps.cn/",
                  "Cookie": cookie,
              }
              try:
                  st, raw = http("https://personal-bus.wps.cn/sign_in/v1/encrypt/key", headers=base)
                  d = as_json(raw)
                  print("  [WPS·公钥] HTTP %s %s" % (st, short(raw, 120)))
                  if d.get("result") != "ok" or not d.get("data"):
                      return False, "获取公钥失败：HTTP %s %s" % (st, short(str(d.get("msg") or raw), 90))
                  pub_pem = base64.b64decode(d["data"]).decode("utf-8")
                  aes_key = "".join(random.choice(string.ascii_lowercase + string.digits) for _ in range(22)) + str(int(time.time()))
                  kb = aes_key.encode("utf-8")
                  key_padded = kb + b"\x00" * (32 - len(kb))
                  iv = aes_key[:16].encode("utf-8")
                  plain = json.dumps({"user_id": user_id, "platform": 64}, separators=(",", ":")).encode("utf-8")
                  extra = base64.b64encode(aes_cbc_encrypt(plain, key_padded, iv)).decode("utf-8")
                  token = base64.b64encode(rsa_pkcs1_encrypt(aes_key.encode("utf-8"), pub_pem)).decode("utf-8")
                  body = json.dumps({"encrypt": True, "extra": extra, "pay_origin": "pc_ucs_rwzx_sign"}).encode("utf-8")
                  st2, raw2 = http("https://personal-bus.wps.cn/sign_in/v1/sign_in",
                                   method="POST", headers=dict(base, token=token), body=body)
                  d2 = as_json(raw2)
                  print("  [WPS·签到] HTTP %s %s" % (st2, short(raw2, 200)))
                  if d2.get("result") == "ok":
                      data = d2.get("data") or {}
                      rewards = data.get("rewards") or []
                      names = [str(r.get("reward_name", "")) for r in rewards
                               if isinstance(r, dict) and r.get("reward_name")]
                      detail = "、".join(names) if names else "奖励已发放"
                      return True, "签到成功，%s。后台「任务中心」按钮会变成「已签到」" % detail
                  if str(d2.get("msg")) == "has sign":
                      return True, "今天已经签过了，后台「任务中心」应是已签到状态"
                  ext = str(d2.get("ext_msg") or "")
                  if ext == "userNotLogin":
                      return False, "登录态失效（userNotLogin）"
                  if "named cookie not present" in ext:
                      return False, "Cookie 缺 wps_sid（named cookie not present）"
                  return False, "HTTP %s %s" % (st2, short(str(d2.get("msg") or ext or raw2), 100))
              except Exception as e:
                  return False, "任务中心异常：%s: %s" % (type(e).__name__, e)


          def task_center_verify(cookie):
              """签到后查一次任务中心后台（对齐 ZaiZaiCat 的 get_user_info），把真实积分带进卡片。"""
              url = ("https://personal-act.wps.cn/activity-rubik/activity/page_info"
                     "?activity_number=HD2025031821201822&page_number=YM2025041617143388")
              hdr = {
                  "User-Agent": UA_PC,
                  "Accept": "application/json, text/plain, */*",
                  "Cookie": cookie,
                  "Referer": "https://personal-act.wps.cn/rubik2/portal/HD2025031821201822/YM2025041617143388?position=mac_grzx_sign",
              }
              try:
                  st, raw = http(url, headers=hdr)
                  d = as_json(raw)
                  print("  [WPS·后台核对] HTTP %s" % st)
                  if d.get("result") != "ok" or not isinstance(d.get("data"), list):
                      return ""
                  info = {}
                  for item in d["data"]:
                      if isinstance(item, dict) and item.get("type") == 36:
                          tc = item.get("task_center_user_info") or {}
                          if isinstance(tc, dict):
                              info = tc
                          break
                  pts, days = info.get("integral"), info.get("total_effect_days")
                  bits = []
                  if isinstance(pts, (int, float)) and pts:
                      bits.append("页面「我的积分」= %s" % pts)
                  if isinstance(days, (int, float)) and days:
                      bits.append("累计有效签到 %s 天" % days)
                  return "；后台核对：" + "、".join(bits) if bits else ""
              except Exception as e:
                  print("  [WPS·后台核对] 查询失败（不影响签到结果）: %s" % type(e).__name__)
                  return ""


          def push_feishu(webhook, secret, rows):
              """rows: [(名称, 状态, 文案)]，状态 ok / fail / off。没启用的不算失败、不进分母。"""
              if not webhook:
                  print("  [通知] 没填 FEISHU_WEBHOOK，跳过飞书推送")
                  return
              icon = {"ok": "✅", "fail": "❌", "off": "⬜"}
              lines = ["**%s %s**：%s" % (icon[s], name, text) for name, s, text in rows]
              ok_n = sum(1 for _, s, _ in rows if s == "ok")
              fail_n = sum(1 for _, s, _ in rows if s == "fail")
              if fail_n:
                  title = "今日签到 · 有 %d 项没成功" % fail_n
                  template = "orange"
              elif ok_n:
                  good = "、".join(name for name, s, _ in rows if s == "ok")
                  title = "今日签到 · %s 已签到" % good
                  template = "green"
              else:
                  title = "今日签到 · 还没有启用任何平台"
                  template = "orange"
              card = {
                  "config": {"wide_screen_mode": True},
                  "header": {"title": {"tag": "plain_text", "content": title}, "template": template},
                  "elements": [
                      {"tag": "div", "text": {"tag": "lark_md", "content": chr(10).join(lines)}},
                      {"tag": "hr"},
                      {"tag": "note", "elements": [{"tag": "plain_text",
                                                     "content": "每天下午 2 点自动运行 · 版本 V8 · 没启用的项目不会报错，也不影响网易云"}]},
                  ],
              }
              payload = {"msg_type": "interactive", "card": card}
              if secret:
                  ts = str(int(time.time()))
                  digest = hmac.new((ts + chr(10) + secret).encode("utf-8"), digestmod=hashlib.sha256).digest()
                  payload["timestamp"] = ts
                  payload["sign"] = base64.b64encode(digest).decode("utf-8")
              try:
                  st, raw = http(webhook, method="POST", headers={"Content-Type": "application/json"},
                                 body=json.dumps(payload, ensure_ascii=False).encode("utf-8"))
                  print("  [通知] 飞书返回 HTTP %s: %s" % (st, short(raw, 140)))
              except Exception as e:
                  print("  [通知] 推送失败: %s: %s" % (type(e).__name__, e))


          def main():
              task_cookie = norm_wps_cookie(os.environ.get("WPS_TASK_COOKIE"))
              old_cookie = norm_wps_cookie(os.environ.get("WPS_COOKIE"))
              wps_uid = (os.environ.get("WPS_UID") or "").strip()
              # 没填新 Secret 时，自动复用之前填过的 WPS_COOKIE，尽量让用户少操作一步
              wps_cookie = task_cookie or old_cookie
              wps_src = "WPS_TASK_COOKIE" if task_cookie else ("WPS_COOKIE（自动复用）" if old_cookie else "")
              netease_cookie = (os.environ.get("NETEASE_COOKIE") or "").strip()
              webhook = (os.environ.get("FEISHU_WEBHOOK") or "").strip()
              secret = (os.environ.get("FEISHU_SECRET") or "").strip()

              print("=" * 46)
              print("每日签到开始（下午 2 点）")
              print("=" * 46)
              rows = []

              if wps_cookie:
                  print("[WPS 任务中心] 已启用（Cookie 来源：%s），开始签到 ..." % wps_src)
                  ok, msg = task_center_sign(wps_cookie, wps_uid)
                  if ok:
                      msg += task_center_verify(wps_cookie)
                  print("  -> %s：%s" % ("成功" if ok else "没成功", msg))
                  rows.append(("WPS 任务中心", "ok" if ok else "fail", msg if ok else humanize_wps(msg)))
              else:
                  print("[WPS 任务中心] 没启用（没有任何 WPS Cookie），跳过")
                  rows.append(("WPS 任务中心", "off",
                               "没启用。想签到就加一个 Secret `WPS_TASK_COOKIE`（教程第 3 步）；不加也完全不影响网易云"))

              print("[网易云音乐] 开始签到 ...")
              ok, msg = netease_sign(netease_cookie)
              print("  -> %s：%s" % ("成功" if ok else "没成功", msg))
              rows.append(("网易云音乐", "ok" if ok else "fail", msg))

              push_feishu(webhook, secret, rows)
              ok_n = sum(1 for _, s, _ in rows if s == "ok")
              print("流程结束：成功 %d 项" % ok_n)
              # 网易云是唯一默认必跑项；它失败才标红，没启用的项目不算失败
              raise SystemExit(0 if ok_n >= 1 else 1)


          main()
          PY
  anyrouter:
    name: Any Router / AgentRouter 签到（可选）
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - name: 执行签到并写出结果
        id: checkin
        env:
          AGENTROUTER_LOGIN: ${{ secrets.AGENTROUTER_LOGIN }}
          AGENTROUTER_COOKIE: ${{ secrets.AGENTROUTER_COOKIE }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
          ANYROUTER_RAW_COOKIE: ${{ secrets.ANYROUTER_RAW_COOKIE }}
          ENABLE_ANYROUTER: ${{ secrets.ENABLE_ANYROUTER }}
        run: |
          python3 - <<'PY'
          import gzip
          import http.cookiejar
          import json
          import os
          import re
          import ssl
          import sys
          import urllib.error
          import urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36")
          SITES = ["https://agentrouter.org", "https://ps.air-outer.com", "https://anyrouter.top"]
          RESULT = "/tmp/ar_result.json"


          def log(msg):
              print(msg, flush=True)


          def env(name):
              return (os.environ.get(name) or "").strip()


          def body_text(raw):
              try:
                  if raw[:2] == b"\x1f\x8b":
                      raw = gzip.decompress(raw)
              except Exception:
                  pass
              return raw.decode("utf-8", "replace")


          def is_waf(text):
              low = text.lower()
              return ("<" in text and ("acw_sc__v2" in low or "acw_tc" in low
                                       or "captcha" in low or "滑块" in text or "challenge" in low))


          def request(site, path, method="GET", payload=None, cookie="", api_user="", jar=None, timeout=20):
              # 统一 HTTP 出口：测试时用假的 request 替换即可，不发任何真实请求
              headers = {
                  "User-Agent": UA,
                  "Accept": "application/json, text/plain, */*",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
                  "Content-Type": "application/json",
                  "Origin": site,
                  "Referer": site + "/console",
                  "X-Requested-With": "XMLHttpRequest",
              }
              if cookie:
                  headers["Cookie"] = cookie
              if api_user:
                  headers["new-api-user"] = str(api_user)
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              req = urllib.request.Request(site + path, data=data, headers=headers, method=method)
              opener = urllib.request.build_opener(
                  urllib.request.HTTPCookieProcessor(jar if jar is not None else http.cookiejar.CookieJar()),
                  urllib.request.HTTPSHandler(context=ssl.create_default_context()))
              try:
                  with opener.open(req, timeout=timeout) as r:
                      return r.status, r.read(), r.headers
              except urllib.error.HTTPError as e:
                  return e.code, e.read(), e.headers
              except Exception as e:
                  return 0, ("%s: %s" % (type(e).__name__, e)).encode("utf-8"), {}


          def parse_accounts(raw):
              # 把任意写法的账号配置拆成凭证列表：坏格式一律返回空列表，绝不抛异常
              out = []
              if not raw:
                  return out
              try:
                  obj = json.loads(raw)
                  if isinstance(obj, dict):
                      obj = [obj]
                  if isinstance(obj, list):
                      for it in obj:
                          if not isinstance(it, dict):
                              continue
                          ck = it.get("cookies") if isinstance(it.get("cookies"), dict) else {}
                          sid = it.get("session") or ck.get("session")
                          if sid:
                              out.append({"kind": "cookie", "cookie": "session=" + str(sid),
                                          "api_user": str(it.get("api_user") or "")})
                          elif it.get("email") and it.get("password"):
                              out.append({"kind": "password", "email": str(it["email"]),
                                          "password": str(it["password"]), "api_user": str(it.get("api_user") or "")})
                      if out:
                          return out
              except Exception:
                  pass
              for line in raw.splitlines():
                  s = line.strip().strip(",").strip("[]{}").strip().strip('"').strip()
                  if not s or s.startswith("#") or s.startswith("//"):
                      continue
                  if re.search(r"(^|[;\s])session=", s, re.I) or "acw_tc=" in s:
                      m = re.search(r"(?i)new-api-user[=:]\s*(\d+)", s)
                      out.append({"kind": "cookie", "cookie": s,
                                  "api_user": m.group(1) if m else ""})
                  elif ":" in s:
                      site = ""
                      if "|" in s:
                          site, s = s.split("|", 1)
                          s = s.strip()
                      email, pwd = s.split(":", 1)
                      if email.strip() and pwd.strip():
                          out.append({"kind": "password", "email": email.strip(),
                                      "password": pwd.strip(), "site": site.strip(), "api_user": ""})
              return out


          def collect():
              # 收集所有凭证来源，任一有效即可；返回 (creds, notes)
              creds, notes = [], []

              def add(items, origin):
                  for c in items:
                      c = dict(c)
                      c["from"] = origin
                      c["label"] = ("浏览器 Cookie（%s）" % origin) if c["kind"] == "cookie" else ("账号密码（%s）" % origin)
                      creds.append(c)

              add(parse_accounts(env("AGENTROUTER_LOGIN")), "AGENTROUTER_LOGIN")

              u, p = env("USERNAME"), env("PASSWORD")
              if u and p:
                  add([{"kind": "password", "email": u, "password": p, "site": "", "api_user": ""}], "USERNAME / PASSWORD")

              for name in ("AGENTROUTER_COOKIE", "ANYROUTER_RAW_COOKIE"):
                  raw = env(name)
                  if not raw:
                      continue
                  if raw.lstrip().startswith("["):
                      add(parse_accounts(raw), name)
                  else:
                      m = re.search(r"(?i)new-api-user[=:]\s*(\d+)", raw)
                      add([{"kind": "cookie", "cookie": raw,
                            "api_user": m.group(1) if m else ""}], name)

              old = env("ANYROUTER_ACCOUNTS")
              if old:
                  parsed = parse_accounts(old)
                  if parsed:
                      add(parsed, "ANYROUTER_ACCOUNTS")
                  else:
                      notes.append("旧的 ANYROUTER_ACCOUNTS 里的内容没认出来（既不是 JSON、也不是 邮箱:密码），"
                                   "这次先跳过它；它不会让任务报错，也不影响其它填法")

              # 去重
              seen, uniq = set(), []
              for c in creds:
                  key = (c["kind"], c.get("email", ""), c.get("password", ""), c.get("cookie", ""))
                  if key in seen:
                      continue
                  seen.add(key)
                  uniq.append(c)
              return uniq, notes


          def quota_of(data):
              try:
                  d = data.get("data") or {}
                  q = d.get("quota")
                  if q is None:
                      return ""
                  return "$%.2f" % (float(q) / 500000.0)
              except Exception:
                  return ""


          def one_attempt(site, cred):
              info = {"site": site, "mode": cred["label"], "ok": False, "balance": "",
                      "evidence": "", "problem": "", "waf": False, "api": ""}
              jar = http.cookiejar.CookieJar()
              cookie = cred.get("cookie", "") if cred["kind"] == "cookie" else ""
              api_user = cred.get("api_user", "")
              authenticated = False

              if cred["kind"] == "password":
                  st, raw, _ = request(site, "/api/user/login", "POST",
                                       {"username": cred["email"], "password": cred["password"]}, jar=jar)
                  text = body_text(raw)
                  info["api"] = "POST /api/user/login -> %s" % st
                  if is_waf(text):
                      info["waf"] = True
                      info["problem"] = "网站弹了人机验证（WAF），这个服务器 IP 被挡了"
                      return info
                  try:
                      d = json.loads(text)
                  except Exception:
                      d = {}
                  if not d.get("success"):
                      msg = str(d.get("message") or d.get("msg") or text[:100]).strip()
                      info["problem"] = "登录没通过：%s" % msg
                      return info
                  info["evidence"] = "登录接口返回成功（success=true）"
                  authenticated = True
              else:
                  info["evidence"] = "直接用了浏览器登录态"
                  info["api"] = "GET /api/user/self -> 待查"

              st2, raw2, _ = request(site, "/api/user/self", "GET", None,
                                     cookie=cookie, api_user=api_user, jar=jar)
              text2 = body_text(raw2)
              info["api"] = "GET /api/user/self -> %s" % st2
              if is_waf(text2):
                  info["waf"] = True
                  info["problem"] = "网站弹了人机验证（WAF），这个服务器 IP 被挡了"
                  return info
              try:
                  d2 = json.loads(text2)
              except Exception:
                  d2 = {}
              if st2 == 200 and d2.get("success"):
                  info["balance"] = quota_of(d2)
                  info["ok"] = True
                  info["evidence"] += "，并读到账号余额 %s" % (info["balance"] or "（站点没给数字）")
                  return info
              msg2 = str(d2.get("message") or text2[:100]).strip()
              info["problem"] = "读账号信息没通过（HTTP %s）：%s" % (st2, msg2)

              # 旧站 anyrouter.top 还留着独立签到接口；只有确实登录上了才允许拿它兜底，
              # 否则「没登录却返回 success」会造成假成功
              if authenticated and "anyrouter.top" in site:
                  st3, raw3, _ = request(site, "/api/user/sign_in", "POST", {},
                                         cookie=cookie, api_user=api_user, jar=jar)
                  t3 = body_text(raw3)
                  try:
                      d3 = json.loads(t3)
                  except Exception:
                      d3 = {}
                  msg3 = str(d3.get("message") or d3.get("msg") or "")
                  if st3 == 200 and (d3.get("success") or d3.get("ret") == 1 or d3.get("code") == 0
                                     or any(k in msg3 for k in ("已签到", "已经签到", "重复签到"))):
                      info["ok"] = True
                      info["problem"] = ""
                      info["api"] = "POST /api/user/sign_in -> %s" % st3
                      info["evidence"] = "签到接口返回成功或「今天已签到」：%s" % (msg3 or "success")
              return info


          def main():
              result = {"status": "no_credentials", "ok": False, "site": "", "mode": "",
                        "balance": "", "evidence": "", "problem": "", "waf": False,
                        "notes": [], "attempts": [], "version": "V8"}
              if env("ENABLE_ANYROUTER") == "no":
                  result["status"] = "disabled"
                  result["problem"] = "你手动停用了（Secret ENABLE_ANYROUTER=no），今天没签到"
                  log("已手动停用（ENABLE_ANYROUTER=no）")
              else:
                  creds, notes = collect()
                  result["notes"] = notes
                  for n in notes:
                      log(n)
                  if not creds:
                      result["problem"] = "没找到能用的账号 / Cookie，今天没签到"
                      log(result["problem"])
                  else:
                      log("找到 %d 份配置，开始逐个尝试（任一成功即停）" % len(creds))
                      for site in SITES:
                          for c in creds:
                              site_override = c.get("site") or ""
                              if site_override:
                                  target = site_override.rstrip("/")
                              else:
                                  target = site
                              try:
                                  r = one_attempt(target, c)
                              except Exception as e:
                                  r = {"site": target, "mode": c["label"], "ok": False, "balance": "",
                                       "evidence": "", "problem": "%s: %s" % (type(e).__name__, e),
                                       "waf": False, "api": ""}
                              result["attempts"].append(r)
                              log("[%s] %s / %s -> %s %s" % (
                                  "OK" if r["ok"] else "NO", target, c["label"],
                                  r["evidence"] or r["problem"], r["api"]))
                              if r["ok"]:
                                  break
                          if any(a["ok"] for a in result["attempts"]):
                              break
                      good = next((a for a in result["attempts"] if a["ok"]), None)
                      if good:
                          result.update({"status": "ok", "ok": True, "site": good["site"],
                                         "mode": good["mode"], "balance": good["balance"],
                                         "evidence": good["evidence"]})
                          log("签到动作完成：%s" % good["evidence"])
                      else:
                          result["status"] = "failed"
                          result["site"] = SITES[0]
                          result["mode"] = creds[0]["label"]
                          result["waf"] = any(a.get("waf") for a in result["attempts"])
                          tried = []
                          for a in result["attempts"]:
                              s = a["problem"]
                              if s and s not in tried:
                                  tried.append(s)
                          result["problem"] = "；".join(tried[:2]) or "所有方式都没签到成功"
                          log("没签到成功：%s" % result["problem"])
              with open(RESULT, "w", encoding="utf-8") as f:
                  json.dump(result, f, ensure_ascii=False, indent=2)
              log("结果已写出：" + RESULT)


          main()
          PY

      - name: 飞书通知（Any Router 结果）
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          AR_RESULT_PATH: /tmp/ar_result.json
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time
          import urllib.request

          webhook = (os.environ.get("FEISHU_WEBHOOK") or "").strip()
          if not webhook:
              print("没填 FEISHU_WEBHOOK，无法推送")
              raise SystemExit(0)

          path = (os.environ.get("AR_RESULT_PATH") or "/tmp/ar_result.json").strip()
          try:
