          lines = []

          if status == "disabled":
              head, color = "未启用", "orange"
              lines.append("**Any Router [未启用]** 你手动停用了（`ENABLE_ANYROUTER=no`），今天没签到。")
              lines.append("想恢复就把这个 Secret 删掉。网易云和 WPS 完全不受影响。")
          elif status == "no_credentials":
              head, color = "未启用", "orange"
              lines.append("**Any Router [未启用]** 一个能用的账号 / Cookie 都没找到，今天没签到。")
          elif ok:
              head, color = "签到成功", "green"
              lines.append("**Any Router [签到成功]** 已在 **%s** 完成登录签到。" % (r.get("site") or "官网"))
          else:
              head, color = "没签到成功", "orange"
              lines.append("**Any Router [没签到成功]** %s" % (r.get("problem") or "没找到签到成功记录"))

          if status not in ("disabled", "no_credentials"):
              lines.append("")
              lines.append("**本次登录方式**：%s" % (r.get("mode") or "未识别"))
              if ok:
                  lines.append("**官网余额**：%s" % (r.get("balance") or "站点没返回数字"))
                  lines.append("**核对依据**：%s" % (r.get("evidence") or "接口返回成功"))
                  lines.append("")
                  lines.append("去 %s/console 刷新页面，看今天的 $25 有没有到账；"
                               "余额能核对上才算真签到。" % (r.get("site") or "https://agentrouter.org"))
              else:
                  if r.get("waf"):
                      lines.append("")
                      lines.append("**网站把 GitHub 服务器拦了**")
                      lines.append("· 已经自动试过备用域名 `ps.air-outer.com`，仍被拦。")
                      lines.append("· 浏览器 Cookie 里自带网站通行证，改用下面的 Cookie 办法通常就能过。")

          if not ok:
              lines.append("")
              lines.append("**账号填在哪（只加 1 个 Secret 就行）**")
              lines.append("1. 仓库 → Settings → Secrets and variables → Actions → **New repository secret**")
              lines.append("2. Name 填 `AGENTROUTER_LOGIN`")
              lines.append("3. Value 填 `你的登录邮箱:你的登录密码`，例如 `abc@qq.com:123456`")
              lines.append("   · 中间一个冒号，**不要写 JSON、不要加引号、不要方括号**")
              lines.append("4. Add secret → Actions → **Run workflow** 再跑一次")
              lines.append("")
              lines.append("**如果你是 GitHub / LinuxDO 一键登录注册的**")
              lines.append("· 这种账号**没有密码**，账号密码怎么填都签不上，这是之前一直失败的主要原因之一。")
              lines.append("· 改用浏览器 Cookie：Chrome 登录官网 → `F12` → Network → `F5` 刷新 → 点第一个请求")
              lines.append("  → Headers → Request Headers → 复制 `cookie:` 后面**完整一整串**")
              lines.append("· 新建一个 Secret：Name `AGENTROUTER_COOKIE`，Value 粘贴那一整串 → Add secret")
              lines.append("· 两种填法可以同时存在，脚本会自动挑能用的那个")

          notes = r.get("notes") or []
          if notes:
              lines.append("")
              lines.append("**顺带提醒**")
              for n in notes[:2]:
                  lines.append("· " + n)

          lines.append("")
          lines.append("**本次是否签到成功：%s**" % ("是" if ok else "否"))
          if status in ("disabled", "no_credentials"):
              lines.append("（这是「没启用 / 没配好」，不是签到本身出错；网易云和 WPS 完全不受影响）")

          card = {
              "config": {"wide_screen_mode": True},
              "header": {"title": {"tag": "plain_text", "content": "Any Router · %s" % head},
                         "template": color},
