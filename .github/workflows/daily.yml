name: 每日签到（网易云 + 可选 WPS / Any Router）

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 的 cron 使用 UTC；06:00 UTC = 北京时间 14:00（下午 2 点）
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run daily sign-in
        env:
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
          WPS_TASK_COOKIE: ${{ secrets.WPS_TASK_COOKIE }}
          WPS_UID: ${{ secrets.WPS_UID }}
          WPS_COOKIE: ${{ secrets.WPS_COOKIE }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          if [ -n "$WPS_TASK_COOKIE" ]; then python3 -m pip install --quiet pycryptodome; fi
          python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          UA_PC = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"
          UA_IPHONE = "Mozilla/5.0 (iPhone; CPU iPhone OS 13_5_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/13.1.1 Mobile/15E148 Safari/604.1"
          UA_MAC = "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_5) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/13.1.1 Safari/605.1.15"


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          OPENER = urllib.request.build_opener(NoRedirect)


          def http(url, method="GET", headers=None, body=None):
              req = urllib.request.Request(url, data=body, headers=headers or {}, method=method)
              try:
                  with OPENER.open(req, timeout=20) as resp:
                      return resp.status, resp.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, e.read().decode("utf-8", "replace")
                  except Exception:
                      return e.code, ""
              except Exception as e:
                  return -1, "%s: %s" % (type(e).__name__, e)


          def as_json(raw):
              try:
                  return json.loads(raw)
              except Exception:
                  return {"_raw": raw[:160]}


          def short(text, n=140):
              text = str(text).replace("\n", " ")
              return text if len(text) <= n else text[:n] + "…"


          def find_point(obj, depth=0):
              """网易云奖励数值可能叫 point / points / award，也可能藏在 data 里；找不到就返回 None。"""
              if depth > 3 or obj is None:
                  return None
              if isinstance(obj, dict):
                  for k in ("point", "points", "award", "score", "num"):
                      v = obj.get(k)
                      if isinstance(v, (int, float)) and not isinstance(v, bool):
                          return v
                      if isinstance(v, str) and v.strip().isdigit():
                          return int(v.strip())
                  for v in obj.values():
                      r = find_point(v, depth + 1)
                      if r is not None:
                          return r
              return None


          def netease_sign(cookie):
              """网易云每日签到：code=200 成功 / -2 今日已签 / 301 未登录。"""
              cookie = (cookie or "").strip()
              if not cookie:
                  return False, "没填 NETEASE_COOKIE，去仓库 Secrets 里加一个"
              notes = []
              for typ, ua, label in ((0, UA_IPHONE, "App"), (1, UA_MAC, "网页")):
                  try:
                      st, raw = http("https://music.163.com/api/point/dailyTask?type=%d" % typ,
                                     headers={"Cookie": cookie, "User-Agent": ua,
                                              "Referer": "https://music.163.com/"})
                      d = as_json(raw)
                      code = d.get("code")
                      print("  [网易云 %s] HTTP %s %s" % (label, st, short(raw, 160)))
                      if code in (200, -2) or "已签" in str(d.get("message") or ""):
                          if code == -2:
                              return True, "今天已经签过了（重复签到，不用再签）"
                          point = find_point(d)
                          if point is not None:
                              return True, "签到成功，云贝/经验 +%s。去 App「云贝中心」能核对" % point
                          return True, "签到成功，云贝已发放。去 App「云贝中心」核对余额"
                      if code == 301:
                          notes.append("%s：Cookie 失效了，重新抓一次 NETEASE_COOKIE（要含 MUSIC_U）" % label)
                      else:
                          notes.append("%s：接口返回 code=%s %s" % (label, code, d.get("message") or ""))
                  except Exception as e:
                      notes.append("%s：连不上（%s）" % (label, type(e).__name__))
              return False, "；".join(notes)


          def humanize_wps(msg):
              """把接口黑话翻译成人话。"""
              m = str(msg)
              if "userNotLogin" in m or "登录态失效" in m:
                  return "Cookie 不被任务中心认可，去「WPS 任务中心」那个页面重新抓一次（教程第 3 步）"
              if "named cookie" in m or "没有 wps_sid" in m or "缺 wps_sid" in m:
                  return "Cookie 不完整，必须包含 wps_sid=...（教程第 3 步）"
              if "缺少 uid" in m:
                  return "Cookie 里没带 uid=数字，再加一个 Secret `WPS_UID`（WPS 账号信息里的数字用户 ID）"
              if "pycryptodome" in m:
                  return "加密库没装上，重跑一次 Actions 试试"
              if "HTTP" in m or "接口" in m or "异常" in m:
                  return "接口没返回成功：" + short(m, 90) + "（把这张卡片截图发我）"
              return short(m, 110)


          def norm_wps_cookie(c):
              """只贴了一串 V02S... 时自动补成 wps_sid=..."""
              c = (c or "").strip()
              if c and "wps_sid=" not in c and c.startswith("V02S"):
                  return "wps_sid=" + c
              return c


          def task_center_sign(cookie, uid):
              """WPS 用户中心 →「任务 → 签到领奖励」——后台能看见的那一个。"""
              cookie = (cookie or "").strip()
              if not cookie:
                  return False, "没填 WPS_TASK_COOKIE"
              if "wps_sid=" not in cookie:
                  return False, "Cookie 里没有 wps_sid"
              m_uid = re.search(r"(?:^|[;,\s])uid=(\d+)", cookie)
              user_id = int(uid) if str(uid or "").strip().isdigit() else (int(m_uid.group(1)) if m_uid else 0)
              if not user_id:
                  return False, "缺少 uid"
              try:
                  from Crypto.Cipher import AES, PKCS1_v1_5
                  from Crypto.PublicKey import RSA
                  from Crypto.Util.Padding import pad
              except ImportError as e:
                  return False, "缺少加密库 pycryptodome：%s" % e
              import random
              import string
              base = {
                  "User-Agent": UA_PC,
                  "Accept": "application/json, text/plain, */*",
                  "Content-Type": "application/json",
                  "Origin": "https://personal-act.wps.cn",
                  "Referer": "https://personal-act.wps.cn/",
                  "Cookie": cookie,
              }
              try:
                  st, raw = http("https://personal-bus.wps.cn/sign_in/v1/encrypt/key", headers=base)
                  d = as_json(raw)
                  print("  [WPS·公钥] HTTP %s %s" % (st, short(raw, 120)))
                  if d.get("result") != "ok" or not d.get("data"):
                      return False, "获取公钥失败：HTTP %s %s" % (st, short(str(d.get("msg") or raw), 90))
                  pub_pem = base64.b64decode(d["data"]).decode("utf-8")
                  aes_key = "".join(random.choice(string.ascii_lowercase + string.digits) for _ in range(22)) + str(int(time.time()))
                  kb = aes_key.encode("utf-8")
                  key_padded = kb + b"\x00" * (32 - len(kb))
                  iv = aes_key[:16].encode("utf-8")
                  plain = json.dumps({"user_id": user_id, "platform": 64}, separators=(",", ":")).encode("utf-8")
                  extra = base64.b64encode(AES.new(key_padded, AES.MODE_CBC, iv).encrypt(pad(plain, 16))).decode("utf-8")
                  token = base64.b64encode(PKCS1_v1_5.new(RSA.import_key(pub_pem)).encrypt(aes_key.encode("utf-8"))).decode("utf-8")
                  body = json.dumps({"encrypt": True, "extra": extra, "pay_origin": "pc_ucs_rwzx_sign"}).encode("utf-8")
                  st2, raw2 = http("https://personal-bus.wps.cn/sign_in/v1/sign_in",
                                   method="POST", headers=dict(base, token=token), body=body)
                  d2 = as_json(raw2)
                  print("  [WPS·签到] HTTP %s %s" % (st2, short(raw2, 200)))
                  if d2.get("result") == "ok":
                      data = d2.get("data") or {}
                      rewards = data.get("rewards") or []
                      names = [str(r.get("reward_name", "")) for r in rewards
                               if isinstance(r, dict) and r.get("reward_name")]
                      detail = "、".join(names) if names else "奖励已发放"
                      return True, "签到成功，%s。后台「任务中心」按钮会变成「已签到」" % detail
                  if str(d2.get("msg")) == "has sign":
                      return True, "今天已经签过了，后台「任务中心」应是已签到状态"
                  ext = str(d2.get("ext_msg") or "")
                  if ext == "userNotLogin":
                      return False, "登录态失效（userNotLogin）"
                  if "named cookie not present" in ext:
                      return False, "Cookie 缺 wps_sid（named cookie not present）"
                  return False, "HTTP %s %s" % (st2, short(str(d2.get("msg") or ext or raw2), 100))
              except Exception as e:
                  return False, "任务中心异常：%s: %s" % (type(e).__name__, e)


          def task_center_verify(cookie):
              """签到后查一次任务中心后台（对齐 ZaiZaiCat 的 get_user_info），把真实积分带进卡片。"""
              url = ("https://personal-act.wps.cn/activity-rubik/activity/page_info"
                     "?activity_number=HD2025031821201822&page_number=YM2025041617143388")
              hdr = {
                  "User-Agent": UA_PC,
                  "Accept": "application/json, text/plain, */*",
                  "Cookie": cookie,
                  "Referer": "https://personal-act.wps.cn/rubik2/portal/HD2025031821201822/YM2025041617143388?position=mac_grzx_sign",
              }
              try:
                  st, raw = http(url, headers=hdr)
                  d = as_json(raw)
                  print("  [WPS·后台核对] HTTP %s" % st)
                  if d.get("result") != "ok" or not isinstance(d.get("data"), list):
                      return ""
                  info = {}
                  for item in d["data"]:
                      if isinstance(item, dict) and item.get("type") == 36:
                          tc = item.get("task_center_user_info") or {}
                          if isinstance(tc, dict):
                              info = tc
                          break
                  pts, days = info.get("integral"), info.get("total_effect_days")
                  bits = []
                  if isinstance(pts, (int, float)) and pts:
                      bits.append("页面「我的积分」= %s" % pts)
                  if isinstance(days, (int, float)) and days:
                      bits.append("累计有效签到 %s 天" % days)
                  return "；后台核对：" + "、".join(bits) if bits else ""
              except Exception as e:
                  print("  [WPS·后台核对] 查询失败（不影响签到结果）: %s" % type(e).__name__)
                  return ""


          def push_feishu(webhook, secret, rows):
              """rows: [(名称, 状态, 文案)]，状态 ok / fail / off。没启用的不算失败、不进分母。"""
              if not webhook:
                  print("  [通知] 没填 FEISHU_WEBHOOK，跳过飞书推送")
                  return
              icon = {"ok": "✅", "fail": "❌", "off": "⬜"}
              lines = ["**%s %s**：%s" % (icon[s], name, text) for name, s, text in rows]
              ok_n = sum(1 for _, s, _ in rows if s == "ok")
              fail_n = sum(1 for _, s, _ in rows if s == "fail")
              if fail_n:
                  title = "今日签到 · 有 %d 项没成功" % fail_n
                  template = "orange"
              elif ok_n:
                  good = "、".join(name for name, s, _ in rows if s == "ok")
                  title = "今日签到 · %s 已签到" % good
                  template = "green"
              else:
                  title = "今日签到 · 还没有启用任何平台"
                  template = "orange"
              card = {
                  "config": {"wide_screen_mode": True},
                  "header": {"title": {"tag": "plain_text", "content": title}, "template": template},
                  "elements": [
                      {"tag": "div", "text": {"tag": "lark_md", "content": chr(10).join(lines)}},
                      {"tag": "hr"},
                      {"tag": "note", "elements": [{"tag": "plain_text",
                                                     "content": "每天下午 2 点自动运行 · 没启用的项目不会报错，也不影响网易云"}]},
                  ],
              }
              payload = {"msg_type": "interactive", "card": card}
              if secret:
                  ts = str(int(time.time()))
                  digest = hmac.new((ts + chr(10) + secret).encode("utf-8"), digestmod=hashlib.sha256).digest()
                  payload["timestamp"] = ts
                  payload["sign"] = base64.b64encode(digest).decode("utf-8")
              try:
                  st, raw = http(webhook, method="POST", headers={"Content-Type": "application/json"},
                                 body=json.dumps(payload, ensure_ascii=False).encode("utf-8"))
                  print("  [通知] 飞书返回 HTTP %s: %s" % (st, short(raw, 140)))
              except Exception as e:
                  print("  [通知] 推送失败: %s: %s" % (type(e).__name__, e))


          def main():
              task_cookie = norm_wps_cookie(os.environ.get("WPS_TASK_COOKIE"))
              old_cookie = norm_wps_cookie(os.environ.get("WPS_COOKIE"))
              wps_uid = (os.environ.get("WPS_UID") or "").strip()
              # 没填新 Secret 时，自动复用之前填过的 WPS_COOKIE，尽量让用户少操作一步
              wps_cookie = task_cookie or old_cookie
              wps_src = "WPS_TASK_COOKIE" if task_cookie else ("WPS_COOKIE（自动复用）" if old_cookie else "")
              netease_cookie = (os.environ.get("NETEASE_COOKIE") or "").strip()
              webhook = (os.environ.get("FEISHU_WEBHOOK") or "").strip()
              secret = (os.environ.get("FEISHU_SECRET") or "").strip()

              print("=" * 46)
              print("每日签到开始（下午 2 点）")
              print("=" * 46)
              rows = []

              if wps_cookie:
                  print("[WPS 任务中心] 已启用（Cookie 来源：%s），开始签到 ..." % wps_src)
                  ok, msg = task_center_sign(wps_cookie, wps_uid)
                  if ok:
                      msg += task_center_verify(wps_cookie)
                  print("  -> %s：%s" % ("成功" if ok else "没成功", msg))
                  rows.append(("WPS 任务中心", "ok" if ok else "fail", msg if ok else humanize_wps(msg)))
              else:
                  print("[WPS 任务中心] 没启用（没有任何 WPS Cookie），跳过")
                  rows.append(("WPS 任务中心", "off",
                               "没启用。想签到就加一个 Secret `WPS_TASK_COOKIE`（教程第 3 步）；不加也完全不影响网易云"))

              print("[网易云音乐] 开始签到 ...")
              ok, msg = netease_sign(netease_cookie)
              print("  -> %s：%s" % ("成功" if ok else "没成功", msg))
              rows.append(("网易云音乐", "ok" if ok else "fail", msg))

              push_feishu(webhook, secret, rows)
              ok_n = sum(1 for _, s, _ in rows if s == "ok")
              print("流程结束：成功 %d 项" % ok_n)
              # 网易云是唯一默认必跑项；它失败才标红，没启用的项目不算失败
              raise SystemExit(0 if ok_n >= 1 else 1)


          main()
          PY
  anyrouter:
    name: Any Router 账号签到（可选）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    env:
      ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
      ENABLE_ANYROUTER: ${{ secrets.ENABLE_ANYROUTER }}
    steps:
      - name: 检查是否已启用
        id: check
        run: |
          if [ "$ENABLE_ANYROUTER" = "no" ]; then
            echo "已手动停用（ENABLE_ANYROUTER=no），跳过"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=manual_off" >> "$GITHUB_OUTPUT"
          elif [ -z "$ANYROUTER_ACCOUNTS" ]; then
            echo "没填 ANYROUTER_ACCOUNTS，跳过"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_accounts" >> "$GITHUB_OUTPUT"
          else
            echo "已配置账号，开始签到"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=running" >> "$GITHUB_OUTPUT"
          fi

      - name: 拉取 Any Router 签到项目（固定版本）
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: millylee/anyrouter-check-in
          ref: 3b16662142c68703ea3e79c77c06a8cf6bba7990

      - name: 安装 uv
        if: steps.check.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@v5

      - name: 安装 Python 3.11
        if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        if: steps.check.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-color-emoji fonts-wqy-zenhei fonts-freefont-ttf

      - name: 安装项目依赖
        if: steps.check.outputs.enabled == 'true'
        run: uv sync --frozen

      - name: 安装 CloakBrowser
        if: steps.check.outputs.enabled == 'true'
        run: uv run python -m cloakbrowser install

      - name: 执行签到（日志留存，供飞书说明原因）
        id: checkin
        if: steps.check.outputs.enabled == 'true'
        env:
          CHECKIN_HEADLESS: "false"
          CHECKIN_HUMANIZE: "true"
          CHECKIN_WAIT_TIMEOUT_MS: "120000"
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1920x1080x24" uv run checkin.py 2>&1 | tee /tmp/anyrouter-checkin.log

      - name: 飞书通知（Any Router 结果）
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          ACCOUNTS_ENABLED: ${{ steps.check.outputs.enabled }}
          AR_REASON: ${{ steps.check.outputs.reason }}
          CHECKIN_OUTCOME: ${{ steps.checkin.outcome }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import re
          import time
          import urllib.request

          webhook = (os.environ.get("FEISHU_WEBHOOK") or "").strip()
          if not webhook:
              print("没填 FEISHU_WEBHOOK，无法推送")
              raise SystemExit(0)

          enabled = (os.environ.get("ACCOUNTS_ENABLED") or "").strip() == "true"
          reason = (os.environ.get("AR_REASON") or "").strip()
          outcome = (os.environ.get("CHECKIN_OUTCOME") or "").strip() or "skipped"
          ok = enabled and outcome == "success"

          lines = []
          if not enabled:
              status, template = "未启用", "orange"
              if reason == "manual_off":
                  detail = "你手动停用了（Secret ENABLE_ANYROUTER=no），今天没签到。想恢复就把这个 Secret 删掉"
              elif reason == "no_accounts":
                  detail = "没填账号密码，今天没签到。想用就加 Secret ANYROUTER_ACCOUNTS（教程第 4 步）"
              else:
                  detail = "本次没有运行，今天没签到"
          elif ok:
              status, template = "签到成功", "green"
              detail = "签到脚本跑完了，去 Any Router 网站看余额有没有变"
          else:
              status, template = "没签到成功", "orange"
              detail = "签到脚本跑到一半失败了，下面是日志里最可能相关的几行："

          lines.append("**Any Router [%s]** %s" % (status, detail))

          if not ok:
              hints = []
              try:
                  with open("/tmp/anyrouter-checkin.log", encoding="utf-8", errors="replace") as f:
                      log_lines = f.read().splitlines()
                  keys = ("[FAILED]", "[WARN]", "登录失败", "密码", "账号", "错误", "失败",
                          "Error", "error", "Exception", "timeout", "超时", "验证", "captcha")
                  for ln in log_lines[-150:]:
                      clean = re.sub(r"\x1b\[[0-9;]*m", "", ln).strip()
                      if clean and any(k in clean for k in keys) and clean not in hints:
                          hints.append(clean[:110])
                  hints = hints[-3:]
              except Exception:
                  pass
              if hints:
                  lines.append("")
                  lines.append("**日志关键行**")
                  for h in hints:
                      lines.append("· " + h)

          if not ok:
              lines.append("")
              lines.append("**账号密码填在哪（照着核对一遍）**")
              lines.append("1. 仓库 → Settings → Secrets and variables → Actions → New repository secret")
              lines.append("2. Name 填 `ANYROUTER_ACCOUNTS`")
              lines.append('3. Value 填 `[{"email":"你的登录邮箱","password":"你的登录密码"}]`')
              lines.append("4. 用的是 anyrouter.top 网站自己的账号密码，不是 GitHub 密码；已填过就点 Update 重新确认一遍")

          lines.append("")
          lines.append("**本次是否签到成功：%s**" % ("是" if ok else "否"))
          if not enabled:
              lines.append("（这是「没启用」，不是出错；网易云和 WPS 完全不受影响）")

          card = {
              "config": {"wide_screen_mode": True},
              "header": {"title": {"tag": "plain_text", "content": "Any Router · %s" % status},
                         "template": template},
              "elements": [
                  {"tag": "div", "text": {"tag": "lark_md", "content": chr(10).join(lines)}},
                  {"tag": "hr"},
                  {"tag": "note", "elements": [{"tag": "plain_text", "content": "Any Router · 每天下午 2 点"}]},
              ],
          }
          payload = {"msg_type": "interactive", "card": card}
          secret = (os.environ.get("FEISHU_SECRET") or "").strip()
          if secret:
              ts = str(int(time.time()))
              digest = hmac.new((ts + chr(10) + secret).encode("utf-8"), digestmod=hashlib.sha256).digest()
              payload["timestamp"] = ts
              payload["sign"] = base64.b64encode(digest).decode("utf-8")
          try:
              req = urllib.request.Request(webhook,
                                           data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                                           headers={"Content-Type": "application/json"}, method="POST")
              with urllib.request.urlopen(req, timeout=20) as resp:
                  print("飞书返回:", resp.read().decode("utf-8", "replace")[:200])
          except Exception as e:
              print("飞书推送失败:", type(e).__name__, e)
          PY
